[platformio]
default_envs = xteink_x4

; MicroSlate builds on the FreeInk SDK (freeink-sdk submodule) for every device:
;   sticky_release  Seeed reTerminal Sticky, ESP32-S3 + GT911 touch (sticky: the same with debug serial output)
;   xteink_x4pro    Xteink X4 Pro, ESP32-S3 + GT911 touch + frontlight (experimental)
;   e1001_release   Seeed reTerminal E1001, ESP32-S3, 7.5" panel, three keys (e1001: with debug serial output)
;   xteink_x4       Xteink X4, ESP32-C3 (builds; not yet tested on hardware with v3, X4 users stay on v2.1)
;   sticky_bledump  test-only Bluetooth capture build, see below
; The pioarduino platform is pinned in [base]; `git clone --recursive` fetches the SDK.

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Same OTA layout as CrossPoint so its web flasher keeps working.
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_upload.offset_address = 0x10000

build_unflags =
  -std=gnu++11

build_flags =
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DUSE_UTF8_LONG_NAMES=1
  ; SdFat on ESP32 otherwise transfers SPI a byte at a time (~3x slower SD reads).
  -DUSE_SPI_ARRAY_TRANSFER=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DCORE_DEBUG_LEVEL=0
  -DOMIT_FONTS=1
  -Wno-bidi-chars
  -std=gnu++2a

extra_scripts =
  pre:scripts/patch_pioarduino_cache.py
  post:scripts/patch_arduino_rom_libc.py

lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  ; MicroSlate keeps its own ble_keyboard.cpp. FreeInk's BleKeyboardHost stays off
  ; (FREEINK_CAP_BLE_HID_HOST defaults to 0), so only this one NimBLE is in the build.
  h2zero/NimBLE-Arduino@2.5.2

; Arduino's bundled BLE library would clash with NimBLE.
lib_ignore =
  BLE

check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unmatchedSuppression --suppress=*:*/.pio/* --suppress=*:*/freeink-sdk/* --inline-suppr
check_skip_packages = yes

; Core rebuild settings (custom_sdkconfig): these replace the old sdkconfig.defaults.
[firmware_tuned]
custom_sdkconfig =
  ; Real light sleep with BLE alive: PM + tickless idle + BLE modem sleep.
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_BT_CTRL_MODEM_SLEEP=y
  CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1=y
  CONFIG_BT_CTRL_LPCLK_SEL_MAIN_XTAL=y
  CONFIG_ESP_PHY_MAC_BB_PD=y
  ; 30 s watchdog with panic-reboot so a hung loop task recovers cleanly.
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=30
  CONFIG_ESP_TASK_WDT_PANIC=y
  ; Task stack right-sizing and the cloud-component removals below are what lets
  ; the isolated Arduino core rebuild succeed (same as CrossPoint).
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
  CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000

custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

[firmware_tuned_c3]
extends = firmware_tuned
custom_sdkconfig =
  ${firmware_tuned.custom_sdkconfig}
  ; Use ROM libc routines to preserve the C3's shared instruction/data RAM.
  CONFIG_LIBC_OPTIMIZED_MISALIGNED_ACCESS=n
  CONFIG_BT_NIMBLE_CRYPTO_STACK_MBEDTLS=y
  CONFIG_BT_NIMBLE_EXT_SCAN=y
  CONFIG_ESP_IPC_TASK_STACK_SIZE=1024
  CONFIG_ESP_WIFI_GCMP_SUPPORT=n
  CONFIG_FMB_MASTER_TIMEOUT_MS_RESPOND=3000
  CONFIG_FMB_QUEUE_LENGTH=20
  CONFIG_FMB_TCP_CONNECTION_TOUT_SEC=20

[firmware_tuned_s3]
extends = firmware_tuned
custom_sdkconfig =
  ${firmware_tuned.custom_sdkconfig}
  ; TLS encryption in software (2026-11-02). The AES unit needs a DMA-capable internal buffer (1600 B) for every TLS
  ; record; with Wi-Fi, Bluetooth and a large open note sharing internal RAM there was none, and uploading a 247 KB
  ; note failed mid-request three times ("esp-aes: Failed to allocate memory"). Software AES uses ordinary memory.
  CONFIG_MBEDTLS_HARDWARE_AES=n
  ; Wi-Fi and network buffers in PSRAM (2026-11-03). They took 35 to 60 KB of internal RAM from the first Wi-Fi start
  ; and gave it back in small pieces (52 KB free, 11 KB largest), leaving 3 KB at the low point with a keyboard on.
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y

; --- Xteink X4 (ESP32-C3) ----------------------------------------------------
[env:xteink_x4]
extends = base, firmware_tuned_c3
board = esp32-c3-devkitm-1
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DRELEASE_BUILD

; --- Seeed reTerminal Sticky (ESP32-S3R8, 3.97" SSD1677 + GT911 touch) --------
; Serial runs through the board's WCH USB-UART bridge on UART0, not native USB
; CDC, so ARDUINO_USB_CDC_ON_BOOT stays off. Debug serial is ON during bring-up
; (no RELEASE_BUILD). Flash and monitor on the bridge's COM port.
[env:sticky]
extends = base, firmware_tuned_s3
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
; Spellcheck (S3 boards only): the built-in English word list, read straight from flash (src/spell).
board_build.embed_files = data/spell/en_words.dat
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DMS_SPELLCHECK=1

; Sticky with the Bluetooth capture for the BLE rebuild baseline (src/ble_dump.h): pairing state,
; connect and disconnect reasons, HID Report Map, Report References and raw input reports on serial.
; Raw reports are the key codes of what is typed: for test devices only, never a release.
[env:sticky_bledump]
extends = env:sticky
build_flags =
  ${env:sticky.build_flags}
  -DMS_BLE_DUMP=1

; Sticky release build: no serial output (the `sticky` env keeps it for bring-up and debugging).
[env:sticky_release]
extends = env:sticky
build_flags =
  ${env:sticky.build_flags}
  -DRELEASE_BUILD

; --- Xteink X4 Pro (ESP32-S3 + 8 MB PSRAM, 4.26" 800x480 SSD1677/UC8179/UC8279, GT911 touch, frontlight) ---------
; Experimental: FreeInk's X4 Pro profile (confirmed on hardware by FreeInk; Draftling runs on it too), not yet run by
; us. Same chip and panel size as the Sticky, so the touch UI is shared. The panel controller is probed at boot and the
; case's edge band is kept clear (main.cpp). SD is 1-bit SDMMC through SdFat's block-device interface. Memory type
; as CrossPoint's x4pro env. Serial off (RELEASE_BUILD): the pogo-pin USB is the S3's own, used for flashing.
[env:xteink_x4pro]
extends = base, firmware_tuned_s3
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
board_build.embed_files = data/spell/en_words.dat
lib_deps =
  ${base.lib_deps}
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
build_flags =
  ${base.build_flags}
  -DBOARD_HAS_PSRAM
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DFREEINK_DEVICE_X4PRO=1
  -DMS_SPELLCHECK=1
  -DRELEASE_BUILD

; --- Seeed reTerminal E1001 (ESP32-S3R8, 7.5" UC8179 800x480, 3 keys, SD over SPI) -------
; Serial is the board's CH340 bridge on UART0 (native-USB CDC stays off). 32 MB flash, so the
; flash size is overridden from base; the partition table stays CrossPoint's (first 16 MB).
; On a machine that also builds the other envs, give it its own PlatformIO core (PLATFORMIO_CORE_DIR).
[env:e1001]
extends = base, firmware_tuned_s3
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.embed_files = data/spell/en_words.dat
build_flags =
  ${base.build_flags}
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_E1001=1
  -DMS_SPELLCHECK=1

; E1001 release build: no serial output (the `e1001` env keeps it for debugging).
[env:e1001_release]
extends = env:e1001
build_flags =
  ${env:e1001.build_flags}
  -DRELEASE_BUILD
