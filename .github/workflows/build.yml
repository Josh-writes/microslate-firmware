name: Build (CI)

# Builds the firmware for every device on each push / PR / manual run and uploads each
# firmware.bin as a downloadable artifact. No tags, no GitHub release, no website push and
# no secrets, so it also runs on a fork (release.yml runs only on v* tags).
#
# Flash an artifact app-only, so settings and sign-ins survive:
#   esptool.py --chip esp32s3 write_flash 0x10000 firmware.bin   (esp32c3 for xteink_x4)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [sticky_release, xteink_x4pro, e1001_release, xteink_x4]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/build/${{ matrix.env }}
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install "platformio==6.1.19" uv

      # The platform bootstraps its own penv with an open-ended "pioarduino>=6.1.19", which now resolves to 6.2.0.
      # That core wants tool-scons 4.11.1 while platform 55.03.311 pins 4.8.1; the two reinstall over each other and
      # the build stops with "No module named 'SCons.Tool.FortranCommon'". Keep the penv core on 6.1.19 too
      # (https://github.com/pioarduino/platform-espressif32/issues/529).
      - name: Pin the PlatformIO core inside the platform penv
        run: |
          pio pkg install -e ${{ matrix.env }}
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: microslate-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: error
